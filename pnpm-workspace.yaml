engineStrict: true

# Hijacked npm releases are usually pulled within days.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true

blockExoticSubdeps: true

nodeLinker: isolated

savePrefix: ""

# Every package with an install script is named here, allowed or refused.
strictDepBuilds: true
allowBuilds:
  esbuild: false
  # Native add-ons and setup steps the browser bundle never runs.
  "@reown/appkit": false
  bufferutil: false
  keccak: false
  utf-8-validate: false

# The Rings SDK's Poseidon hasher: each browser build looks for its .wasm beside itself, where
# the package ships none. The slim build is pointed at the shipped files, so the bundler packs
# them; the fat build (both inlined as base64, 4.3 MB of JavaScript) refuses to guess.
patchedDependencies:
  "@lightprotocol/hasher.rs@0.2.1": patches/@lightprotocol__hasher.rs@0.2.1.patch

# Advisories in packages this repository installs but the extension never ships: they come in
# through wallet connectors of Privy's SDK that the panel doesn't use, and through the shadcn
# CLI. Each is lifted to a release that fixes its advisory.
overrides:
  "decode-uri-component@<0.5.1": 0.5.1
  "minimatch@>=7.0.0 <11.0.1": 11.0.1
  "uuid@<11.1.1": 11.1.1
  "ws@>=8.0.0 <8.21.0": 8.23.0
  "zod@<4.6.6": 4.6.7
