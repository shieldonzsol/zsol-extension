engineStrict: true

# Hijacked npm releases are usually pulled within days.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true

blockExoticSubdeps: true

nodeLinker: isolated

savePrefix: ""

# Every package with an install script is named here, allowed or refused.
strictDepBuilds: true
allowBuilds:
  esbuild: false
  # Native add-ons and setup steps the browser bundle never runs.
  "@reown/appkit": false
  bufferutil: false
  keccak: false
  utf-8-validate: false
